<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS - AI Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0a0f;
            --bg-panel: rgba(10, 15, 25, 0.7);
            --bg-hover: rgba(0, 212, 255, 0.1);
            --border-color: rgba(0, 212, 255, 0.2);
            --accent-blue: #00d4ff;
            --accent-glow: 0 0 10px rgba(0, 212, 255, 0.5);
            --text-main: #e0f2fe;
            --text-dim: #7dd3fc;
            --font-display: 'Rajdhani', sans-serif;
            --font-mono: 'Roboto Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-display);
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-image: 
                linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        /* Top Bar */
        .top-bar {
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-panel);
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 4px;
            color: var(--accent-blue);
            text-shadow: var(--accent-glow);
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--text-dim);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .status-dot.connected {
            background-color: #00ffaa;
            box-shadow: 0 0 8px #00ffaa;
            animation: pulse-green 2s infinite;
        }

        .status-dot.disconnected {
            background-color: #ff3366;
            box-shadow: 0 0 8px #ff3366;
        }

        @keyframes pulse-green {
            0% { box-shadow: 0 0 0 0 rgba(0, 255, 170, 0.4); }
            70% { box-shadow: 0 0 0 6px rgba(0, 255, 170, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 255, 170, 0); }
        }

        .provider-select {
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid var(--border-color);
            color: var(--accent-blue);
            padding: 5px 15px;
            border-radius: 4px;
            font-family: var(--font-mono);
            font-size: 12px;
            outline: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .provider-select:hover {
            box-shadow: var(--accent-glow);
        }

        /* Main Layout */
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Left Sidebar */
        .sidebar-left {
            width: 250px;
            border-right: 1px solid var(--border-color);
            background: var(--bg-panel);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dim);
            letter-spacing: 2px;
            text-transform: uppercase;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
            margin-bottom: 15px;
        }

        .quick-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 15px;
            text-align: left;
            font-family: var(--font-display);
            font-size: 16px;
            font-weight: 500;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0,212,255,0.2), transparent);
            transition: left 0.5s ease;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {
            background: var(--bg-hover);
            border-color: var(--accent-blue);
            box-shadow: inset 0 0 10px rgba(0,212,255,0.2);
            color: var(--accent-blue);
        }

        /* Center Chat Area */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .chat-messages {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 80%;
            animation: fadeIn 0.4s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
        }

        .message.assistant {
            align-self: flex-start;
        }

        .message-bubble {
            padding: 15px 20px;
            border-radius: 8px;
            position: relative;
            font-family: var(--font-mono);
            font-size: 14px;
            line-height: 1.5;
        }

        .message.user .message-bubble {
            background: rgba(0, 212, 255, 0.15);
            border: 1px solid var(--accent-blue);
            border-bottom-right-radius: 0;
            box-shadow: 0 0 15px rgba(0,212,255,0.1);
        }

        .message.assistant .message-bubble {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-bottom-left-radius: 0;
            border-left: 3px solid var(--accent-blue);
        }

        .message-time {
            font-size: 10px;
            color: var(--text-dim);
            margin-top: 5px;
            text-align: right;
        }

        .typing-indicator {
            display: none;
            align-items: center;
            gap: 5px;
            padding: 10px 20px;
            align-self: flex-start;
            margin-top: -10px;
        }

        .typing-indicator.visible {
            display: flex;
        }

        .dot {
            width: 6px;
            height: 6px;
            background: var(--accent-blue);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        .input-area {
            padding: 20px;
            background: var(--bg-panel);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .input-box {
            flex: 1;
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--border-color);
            padding: 15px;
            color: var(--text-main);
            font-family: var(--font-mono);
            font-size: 14px;
            border-radius: 4px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-box:focus {
            border-color: var(--accent-blue);
            box-shadow: var(--accent-glow);
        }

        .btn-icon {
            width: 45px;
            height: 45px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--accent-blue);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s;
        }

        .btn-icon:hover {
            background: var(--bg-hover);
            border-color: var(--accent-blue);
            box-shadow: var(--accent-glow);
        }

        .btn-send {
            background: rgba(0, 212, 255, 0.1);
            border-color: var(--accent-blue);
        }

        /* Right Sidebar */
        .sidebar-right {
            width: 320px;
            border-left: 1px solid var(--border-color);
            background: var(--bg-panel);
            display: flex;
            flex-direction: column;
        }

        .tabs {
            display: flex;
            border-bottom: 1px solid var(--border-color);
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-dim);
            padding: 14px 4px;
            font-family: var(--font-display);
            font-size: 13px;
            letter-spacing: 0.5px;
            white-space: nowrap;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            border-bottom: 2px solid transparent;
        }

        .tab-btn.active {
            color: var(--accent-blue);
            border-bottom-color: var(--accent-blue);
            background: var(--bg-hover);
        }

        .tab-panel {
            display: none;
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .tab-panel.active {
            display: block;
        }

        .tab-panel::-webkit-scrollbar { width: 4px; }
        .tab-panel::-webkit-scrollbar-thumb { background: var(--border-color); }

        .sidebar-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 10px;
            position: relative;
            transition: all 0.3s;
        }

        .sidebar-item:hover {
            border-color: rgba(0,212,255,0.5);
            background: rgba(0,212,255,0.05);
        }

        .sidebar-item.completed {
            opacity: 0.5;
        }
        
        .sidebar-item.completed .item-title {
            text-decoration: line-through;
        }

        .item-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 5px;
        }

        .item-title {
            flex: 1;
            font-weight: 600;
            font-size: 15px;
        }

        .item-desc {
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--text-dim);
            margin-top: 5px;
        }

        .priority {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 3px;
            text-transform: uppercase;
        }

        .priority-high { background: rgba(255,51,102,0.2); color: #ff3366; }
        .priority-medium { background: rgba(255,170,0,0.2); color: #ffaa00; }
        .priority-low { background: rgba(0,255,170,0.2); color: #00ffaa; }

        .btn-delete {
            position: absolute;
            top: 10px;
            right: 10px;
            background: transparent;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .sidebar-item:hover .btn-delete {
            opacity: 1;
        }

        .btn-delete:hover {
            color: #ff3366;
        }
        
        .btn-log {
            margin-top: 8px;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--accent-blue);
            font-family: var(--font-display);
            font-size: 12px;
            padding: 3px 10px;
            border-radius: 3px;
            cursor: pointer;
        }

        .btn-log:hover { background: var(--bg-hover); }

        .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }

        .tag {
            font-family: var(--font-mono);
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 3px;
            background: rgba(0, 212, 255, 0.12);
            color: var(--accent-blue);
        }

        .item-desc.small { font-size: 11px; }

        .message-content a { color: var(--accent-blue); word-break: break-all; }

        .message.error .message-bubble { border-left-color: #ff3366; }

        .message.reminder .message-bubble {
            border-left-color: #ffaa00;
            box-shadow: 0 0 15px rgba(255, 170, 0, 0.25);
        }

        .btn-icon:disabled { opacity: 0.4; cursor: not-allowed; }

        .btn-delete:focus-visible, .btn-log:focus-visible { opacity: 1; outline: 1px solid var(--accent-blue); }

        .empty {
            text-align: center;
            color: var(--text-dim);
            font-family: var(--font-mono);
            font-size: 12px;
            margin-top: 20px;
            font-style: italic;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .modal-overlay.visible {
            opacity: 1;
            pointer-events: all;
        }

        .modal-content {
            background: var(--bg-dark);
            border: 1px solid var(--accent-blue);
            box-shadow: 0 0 30px rgba(0,212,255,0.2);
            padding: 30px;
            border-radius: 8px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.visible .modal-content {
            transform: scale(1);
        }

        .modal-title {
            color: var(--accent-blue);
            margin-bottom: 15px;
            font-size: 20px;
            letter-spacing: 2px;
        }

        .modal-text {
            font-family: var(--font-mono);
            font-size: 14px;
            color: var(--text-main);
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .modal-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .modal-btn {
            padding: 10px 20px;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-main);
            font-family: var(--font-display);
            font-weight: 600;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s;
        }

        .modal-btn.confirm {
            background: rgba(0, 212, 255, 0.2);
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }

        .modal-btn.confirm:hover {
            background: var(--accent-blue);
            color: #000;
            box-shadow: var(--accent-glow);
        }

        .modal-btn.cancel:hover {
            background: rgba(255, 51, 102, 0.2);
            border-color: #ff3366;
            color: #ff3366;
        }

        /* ── HUD Face ── */
        .face-panel {
            --face: #00d4ff;
            --face-soft: rgba(0, 212, 255, 0.35);
            display: flex;
            align-items: center;
            gap: 28px;
            padding: 14px 30px;
            border-bottom: 1px solid var(--border-color);
            background: radial-gradient(ellipse at 110px 50%, rgba(0, 212, 255, 0.08), transparent 60%);
            transition: background 0.4s;
        }

        .face-panel[data-state="listening"] { --face: #4dfcff; --face-soft: rgba(77, 252, 255, 0.5); }
        .face-panel[data-state="alert"]     { --face: #ffaa00; --face-soft: rgba(255, 170, 0, 0.45); }
        .face-panel[data-state="error"]     { --face: #ff3366; --face-soft: rgba(255, 51, 102, 0.45); }
        .face-panel[data-state="offline"]   { --face: #3a5566; --face-soft: rgba(58, 85, 102, 0.2); }

        .face-svg {
            width: 150px;
            height: 150px;
            flex-shrink: 0;
            overflow: visible;
            filter: drop-shadow(0 0 6px var(--face-soft));
            transition: filter 0.4s;
        }

        .face-svg * { transition: stroke 0.4s, fill 0.4s, stop-color 0.4s; }

        .face-svg .ring, .face-svg .face-boundary, .face-svg .face-head, .face-svg .brow {
            fill: none;
            stroke: var(--face);
        }

        .face-svg .ring {
            transform-box: view-box;
            transform-origin: 100px 100px;
        }

        .ring-outer { opacity: 0.55; stroke-width: 1.2; animation: spin 40s linear infinite; }
        .ring-mid   { opacity: 0.8;  stroke-width: 2;   animation: spin 22s linear infinite reverse; }
        .ring-inner { opacity: 0.35; stroke-width: 5;   animation: spin 60s linear infinite; }

        .face-boundary { stroke-width: 0.8; opacity: 0.5; }
        .face-head { stroke-width: 1.4; opacity: 0.85; }
        .brow { stroke-width: 1.6; stroke-linecap: round; opacity: 0.7; }
        .face-grid { opacity: 0.18; }
        .face-grid-line { stroke: var(--face); stroke-width: 0.4; }
        .glow-stop { stop-color: var(--face); }

        .face-svg .eyes rect {
            fill: var(--face);
            transform-box: fill-box;
            transform-origin: center;
            transition: transform 0.12s, fill 0.4s;
        }

        .face-panel.blink .eyes rect { transform: scaleY(0.1); }
        .face-svg .mouth rect { fill: var(--face); }

        .scan-line {
            opacity: 0;
            animation: scan 2.6s ease-in-out infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes scan {
            0%   { transform: translateY(0);     opacity: 0; }
            10%  { opacity: 1; }
            90%  { opacity: 1; }
            100% { transform: translateY(170px); opacity: 0; }
        }
        @keyframes breathe { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
        @keyframes flicker { 0%, 100% { opacity: 1; } 45% { opacity: 0.4; } 55% { opacity: 0.9; } }

        /* State-specific motion */
        .face-panel[data-state="idle"] .face-glow { animation: breathe 4s ease-in-out infinite; }
        .face-panel[data-state="idle"] .scan-line { animation-duration: 6s; }

        .face-panel[data-state="thinking"] .ring-outer { animation-duration: 6s; }
        .face-panel[data-state="thinking"] .ring-mid   { animation-duration: 3s; }
        .face-panel[data-state="thinking"] .ring-inner { animation-duration: 10s; opacity: 0.6; }
        .face-panel[data-state="thinking"] .scan-line  { animation-duration: 1.1s; }
        .face-panel[data-state="thinking"] .face-svg   { filter: drop-shadow(0 0 12px var(--face-soft)); }

        .face-panel[data-state="listening"] .ring-mid  { animation-duration: 8s; }
        .face-panel[data-state="listening"] .face-glow { animation: breathe 1.2s ease-in-out infinite; }

        .face-panel[data-state="speaking"] .scan-line  { animation: none; opacity: 0; }
        .face-panel[data-state="speaking"] .face-svg   { filter: drop-shadow(0 0 10px var(--face-soft)); }

        .face-panel[data-state="alert"] .face-glow     { animation: breathe 0.9s ease-in-out infinite; }
        .face-panel[data-state="error"] .face-svg      { animation: flicker 0.35s steps(2) 4; }
        .face-panel[data-state="offline"] .ring, .face-panel[data-state="offline"] .scan-line { animation-play-state: paused; }

        .face-info {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .face-status-row { display: flex; align-items: center; gap: 12px; }

        .face-status {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 20px;
            letter-spacing: 5px;
            color: var(--face);
            text-shadow: 0 0 10px var(--face-soft);
            transition: color 0.4s;
        }

        .face-caption {
            font-family: var(--font-mono);
            font-size: 12px;
            line-height: 1.6;
            color: var(--text-dim);
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: 3.2em;
        }

        .voice-toggle {
            margin-left: auto;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--accent-blue);
            border-radius: 4px;
            width: 34px;
            height: 30px;
            cursor: pointer;
            font-size: 14px;
        }

        .voice-toggle:hover { background: var(--bg-hover); border-color: var(--accent-blue); }

        .btn-icon.listening {
            border-color: #ff3366;
            color: #ff3366;
            box-shadow: 0 0 12px rgba(255, 51, 102, 0.5);
            animation: breathe 1s ease-in-out infinite;
        }

        @media (max-height: 760px) {
            .face-svg { width: 104px; height: 104px; }
            .face-panel { padding: 10px 24px; }
        }

        @media (max-width: 768px) {
            .face-svg { width: 96px; height: 96px; }
            .face-panel { gap: 16px; padding: 10px 16px; }
            .face-status { font-size: 16px; letter-spacing: 3px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .face-svg .ring, .scan-line, .face-glow { animation: none !important; }
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .sidebar-left { display: none; } /* Hide left sidebar on medium screens */
        }

        @media (max-width: 768px) {
            .main-container { flex-direction: column; }
            .sidebar-right { width: 100%; height: 300px; border-left: none; border-top: 1px solid var(--border-color); }
        }
    </style>
</head>
<body>

    <!-- Top Navigation -->
    <header class="top-bar">
        <div class="logo-container">
            <div class="logo">JARVIS</div>
            <div class="status-indicator">
                <div id="connectionDot" class="status-dot disconnected"></div>
                <span id="connectionText">Connecting...</span>
            </div>
        </div>
        <div>
            <select id="providerSelect" class="provider-select">
                <option value="">Loading...</option>
            </select>
        </div>
    </header>

    <!-- Main Content -->
    <div class="main-container">
        <!-- Left Sidebar: Actions & Stats -->
        <aside class="sidebar-left">
            <div class="section-title">Quick Actions</div>
            <div class="quick-actions">
                <button class="btn" onclick="quickAction('new-task')">✓ New Task</button>
                <button class="btn" onclick="quickAction('set-reminder')">🔔 Set Reminder</button>
                <button class="btn" onclick="quickAction('new-note')">📝 Create Note</button>
                <button class="btn" onclick="quickAction('web-search')">🌐 Web Search</button>
                <button class="btn" onclick="quickAction('weather')">🌤️ Weather</button>
                <button class="btn" onclick="quickAction('add-expense')">💰 Add Expense</button>
                <button class="btn" onclick="quickAction('pomodoro')">⏱️ Pomodoro</button>
                <button class="btn" onclick="quickAction('log-habit')">✅ Log Habit</button>
            </div>
            
            <div class="section-title" style="margin-top: 20px;">System</div>
            <div style="font-family: var(--font-mono); font-size: 12px; color: var(--text-dim); line-height: 1.8;">
                <div id="sysCpu">CPU: Loading...</div>
                <div id="sysRam">RAM: Loading...</div>
                <div id="sysDisk">DISK: Loading...</div>
            </div>
            <button class="btn" style="margin-top: 10px; font-size: 11px;" onclick="quickAction('daily-summary')">📊 Daily Summary</button>
        </aside>

        <!-- Center: Chat Interface -->
        <main class="chat-container">
            <section id="jarvisFace" class="face-panel" data-state="idle" aria-label="Jarvis status">
                <svg class="face-svg" viewBox="0 0 200 200" aria-hidden="true">
                    <defs>
                        <radialGradient id="faceGlowGrad">
                            <stop offset="0%" class="glow-stop" stop-opacity="0.28"/>
                            <stop offset="100%" class="glow-stop" stop-opacity="0"/>
                        </radialGradient>
                        <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" class="glow-stop" stop-opacity="0"/>
                            <stop offset="70%" class="glow-stop" stop-opacity="0.35"/>
                            <stop offset="100%" class="glow-stop" stop-opacity="0.9"/>
                        </linearGradient>
                        <pattern id="faceGridPattern" width="8" height="8" patternUnits="userSpaceOnUse">
                            <path class="face-grid-line" d="M8 0H0V8"/>
                        </pattern>
                        <clipPath id="faceClip"><circle cx="100" cy="100" r="66"/></clipPath>
                    </defs>

                    <circle class="face-glow" cx="100" cy="100" r="78" fill="url(#faceGlowGrad)"/>
                    <circle class="ring ring-outer" cx="100" cy="100" r="95" stroke-dasharray="2 5"/>
                    <circle class="ring ring-mid" cx="100" cy="100" r="85" stroke-dasharray="70 18 14 18 40 22"/>
                    <circle class="ring ring-inner" cx="100" cy="100" r="75" stroke-dasharray="1 5"/>
                    <circle class="face-boundary" cx="100" cy="100" r="66"/>

                    <g clip-path="url(#faceClip)">
                        <rect class="face-grid" x="30" y="30" width="140" height="140" fill="url(#faceGridPattern)"/>
                        <path class="face-head" d="M100 50 C122 50 136 64 137 86 L136 108 C134 128 120 146 100 152 C80 146 66 128 64 108 L63 86 C64 64 78 50 100 50 Z"/>
                        <path class="brow" d="M72 84 Q82 79 92 83"/>
                        <path class="brow" d="M108 83 Q118 79 128 84"/>
                        <g class="eyes">
                            <rect x="72" y="92" width="20" height="5" rx="2.5"/>
                            <rect x="108" y="92" width="20" height="5" rx="2.5"/>
                        </g>
                        <g id="faceMouth" class="mouth"></g>
                        <rect class="scan-line" x="30" y="16" width="140" height="18" fill="url(#scanGrad)"/>
                    </g>
                </svg>

                <div class="face-info">
                    <div class="face-status-row">
                        <span id="faceStatus" class="face-status">STANDBY</span>
                        <button id="voiceToggle" class="voice-toggle" type="button" title="Mute Jarvis">🔊</button>
                    </div>
                    <div id="faceCaption" class="face-caption">Type a command, or press the mic and talk to me.</div>
                </div>
            </section>
            <div id="chatMessages" class="chat-messages" aria-live="polite"></div>
            
            <div id="typingIndicator" class="typing-indicator">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>

            <div class="input-area">
                <button id="micBtn" class="btn-icon" type="button" title="Talk to Jarvis" aria-label="Talk to Jarvis">🎤</button>
                <input type="text" id="messageInput" class="input-box" placeholder="Enter command or query..." autocomplete="off">
                <button class="btn-icon btn-send" onclick="sendMessage()" title="Send" aria-label="Send">➤</button>
            </div>
        </main>

        <!-- Right Sidebar: Data Panels -->
        <aside class="sidebar-right">
            <div class="tabs">
                <button class="tab-btn active" data-tab="tasks" onclick="switchTab('tasks')">Tasks</button>
                <button class="tab-btn" data-tab="reminders" onclick="switchTab('reminders')">Reminders</button>
                <button class="tab-btn" data-tab="notes" onclick="switchTab('notes')">Notes</button>
                <button class="tab-btn" data-tab="expenses" onclick="switchTab('expenses')">Expenses</button>
                <button class="tab-btn" data-tab="habits" onclick="switchTab('habits')">Habits</button>
            </div>
            
            <div id="tasksPanel" class="tab-panel active">
                <div id="tasksList"></div>
            </div>
            
            <div id="remindersPanel" class="tab-panel">
                <div id="remindersList"></div>
            </div>
            
            <div id="notesPanel" class="tab-panel">
                <div id="notesList"></div>
            </div>

            <div id="expensesPanel" class="tab-panel">
                <div id="expensesSummary" style="padding: 8px; font-family: var(--font-mono); font-size: 12px; color: var(--accent-blue); border-bottom: 1px solid var(--border-color); margin-bottom: 8px;">Loading summary...</div>
                <div id="expensesList"></div>
            </div>

            <div id="habitsPanel" class="tab-panel">
                <div id="habitsList"></div>
            </div>
        </aside>
    </div>

    <!-- Confirmation Modal -->
    <div id="confirmModal" class="modal-overlay">
        <div class="modal-content">
            <h2 class="modal-title">AUTHORIZATION REQUIRED</h2>
            <div id="confirmMessage" class="modal-text">Are you sure you want to proceed with this action?</div>
            <div class="modal-actions">
                <button class="modal-btn cancel" onclick="cancelAction()">CANCEL</button>
                <button class="modal-btn confirm" onclick="confirmAction()">CONFIRM</button>
            </div>
        </div>
    </div>

    <!-- Application Logic -->
    <script src="/static/js/face.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
